<div th:fragment="task-list" id="task-list">
    <div class="row">
        <div th:if="${tasks.empty}" class="col-12">
            <div class="text-center py-5">
                <i class="bi bi-clipboard-x fs-1 text-muted"></i>
                <h3 class="text-muted">No tasks yet</h3>
                <p class="text-muted">Create your first task to get started!</p>
                <a href="/tasks/new" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Create Task
                </a>
            </div>
        </div>
        
        <div th:each="task : ${tasks}" class="col-md-6 col-lg-4 mb-3">
            <div class="card task-card h-100" th:classappend="${task.status.name() == 'DONE'} ? 'border-success' : (${task.status.name() == 'IN_PROGRESS'} ? 'border-warning' : 'border-secondary')">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h6 class="mb-0" th:text="${task.title}">Task Title</h6>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" 
                                type="button" 
                                data-bs-toggle="dropdown">
                            <i class="bi bi-three-dots"></i>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/tasks/{id}(id=${task.id})}">
                                <i class="bi bi-eye"></i> View
                            </a></li>
                            <li><a class="dropdown-item" th:href="@{/tasks/{id}/edit(id=${task.id})}">
                                <i class="bi bi-pencil"></i> Edit
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" 
                                       hx-delete th:hx-delete="@{/tasks/{id}(id=${task.id})}"
                                       hx-target="#task-list"
                                       hx-get="/tasks/htmx/list"
                                       hx-confirm="Are you sure you want to delete this task?">
                                <i class="bi bi-trash"></i> Delete
                            </button></li>
                        </ul>
                    </div>
                </div>
                <div class="card-body">
                    <p class="card-text" th:text="${task.description}">Task description</p>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">#<span th:text="${task.id}">1</span></small>
                        
                        <!-- Status Badge with HTMX status change -->
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" 
                                    class="btn status-badge"
                                    th:classappend="${task.status.name() == 'TO_DO'} ? 'btn-secondary' : 'btn-outline-secondary'"
                                    hx-put th:hx-put="@{/tasks/htmx/{id}/status(id=${task.id})}"
                                    hx-vals='{"status": "TO_DO"}'
                                    hx-target="#task-list"
                                    hx-swap="outerHTML"
                                    title="Mark as To Do">
                                <i class="bi bi-circle"></i>
                            </button>
                            <button type="button" 
                                    class="btn status-badge"
                                    th:classappend="${task.status.name() == 'IN_PROGRESS'} ? 'btn-warning' : 'btn-outline-warning'"
                                    hx-put th:hx-put="@{/tasks/htmx/{id}/status(id=${task.id})}"
                                    hx-vals='{"status": "IN_PROGRESS"}'
                                    hx-target="#task-list"
                                    hx-swap="outerHTML"
                                    title="Mark as In Progress">
                                <i class="bi bi-play-circle"></i>
                            </button>
                            <button type="button" 
                                    class="btn status-badge"
                                    th:classappend="${task.status.name() == 'DONE'} ? 'btn-success' : 'btn-outline-success'"
                                    hx-put th:hx-put="@{/tasks/htmx/{id}/status(id=${task.id})}"
                                    hx-vals='{"status": "DONE"}'
                                    hx-target="#task-list"
                                    hx-swap="outerHTML"
                                    title="Mark as Done">
                                <i class="bi bi-check-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
