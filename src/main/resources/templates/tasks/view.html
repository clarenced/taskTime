<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(|Task #${task.id}|, ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">
                            <i class="bi bi-clipboard-check"></i> Task #<span th:text="${task.id}">1</span>
                        </h2>
                        <span class="badge fs-6" 
                              th:classappend="${task.status.name() == 'DONE'} ? 'bg-success' : (${task.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-secondary')"
                              th:text="${task.status.name().replace('_', ' ')}">TO DO</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <h3 class="h4" th:text="${task.title}">Task Title</h3>
                        </div>
                        
                        <div class="mb-4">
                            <h5>Description</h5>
                            <p class="lead" th:text="${task.description}">Task description</p>
                        </div>

                        <div class="mb-4">
                            <h5>Status</h5>
                            <div class="btn-group" role="group" aria-label="Task status">
                                <button type="button" 
                                        class="btn"
                                        th:classappend="${task.status.name() == 'TO_DO'} ? 'btn-secondary' : 'btn-outline-secondary'"
                                        hx-put th:hx-put="@{/tasks/htmx/{id}/status(id=${task.id})}"
                                        hx-vals='{"status": "TO_DO"}'
                                        hx-swap="none"
                                        hx-on::after-request="location.reload()">
                                    <i class="bi bi-circle"></i> To Do
                                </button>
                                <button type="button" 
                                        class="btn"
                                        th:classappend="${task.status.name() == 'IN_PROGRESS'} ? 'btn-warning' : 'btn-outline-warning'"
                                        hx-put th:hx-put="@{/tasks/htmx/{id}/status(id=${task.id})}"
                                        hx-vals='{"status": "IN_PROGRESS"}'
                                        hx-swap="none"
                                        hx-on::after-request="location.reload()">
                                    <i class="bi bi-play-circle"></i> In Progress
                                </button>
                                <button type="button" 
                                        class="btn"
                                        th:classappend="${task.status.name() == 'DONE'} ? 'btn-success' : 'btn-outline-success'"
                                        hx-put th:hx-put="@{/tasks/htmx/{id}/status(id=${task.id})}"
                                        hx-vals='{"status": "DONE"}'
                                        hx-swap="none"
                                        hx-on::after-request="location.reload()">
                                    <i class="bi bi-check-circle"></i> Done
                                </button>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-primary">
                                <i class="bi bi-pencil"></i> Edit Task
                            </a>
                            <button class="btn btn-danger" 
                                   hx-delete th:hx-delete="@{/tasks/{id}(id=${task.id})}"
                                   hx-confirm="Are you sure you want to delete this task?"
                                   hx-on::after-request="window.location='/tasks'">
                                <i class="bi bi-trash"></i> Delete Task
                            </button>
                            <a href="/tasks" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to Tasks
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
