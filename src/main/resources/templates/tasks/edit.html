<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Edit Task', ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0">
                            <i class="bi bi-pencil-square"></i> Edit Task #<span th:text="${task.id}">1</span>
                        </h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/tasks/{id}(id=${task.id})}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                                <input type="text" 
                                       class="form-control" 
                                       id="title" 
                                       name="title" 
                                       th:value="${task.title}"
                                       placeholder="Enter task title..."
                                       required 
                                       minlength="5" 
                                       maxlength="100">
                                <div class="form-text">Must be between 5 and 100 characters</div>
                                <div th:if="${error != null and error and error.field == 'title'}" class="invalid-feedback d-block">
                                    <span th:text="${error.message}">Title error</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                                <textarea class="form-control" 
                                         id="description" 
                                         name="description" 
                                         rows="4" 
                                         placeholder="Enter task description..."
                                         required 
                                         minlength="5" 
                                         maxlength="500" 
                                         th:text="${task.description}"></textarea>
                                <div class="form-text">Must be between 5 and 500 characters</div>
                                <div th:if="${error != null and error and error.field == 'description'}" class="invalid-feedback d-block">
                                    <span th:text="${error.message}">Description error</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option th:each="status : ${statuses}" 
                                           th:value="${status}" 
                                           th:text="${status.name().replace('_', ' ')}"
                                           th:selected="${status == task.status}">Status</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Update Task
                                </button>
                                <a th:href="@{/tasks/{id}(id=${task.id})}" class="btn btn-info">
                                    <i class="bi bi-eye"></i> View
                                </a>
                                <a href="/tasks" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Back to Tasks
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
