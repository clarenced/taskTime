<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Task Management', ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Task Management</h1>
            <a href="/tasks/new" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> New Task
            </a>
        </div>

        <!-- Quick create form -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Quick Add Task</h5>
            </div>
            <div class="card-body">
                <form hx-post="/tasks/htmx/create" 
                      hx-target="#task-list" 
                      hx-swap="outerHTML"
                      hx-on::after-request="this.reset()">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="text" 
                                   name="title" 
                                   class="form-control" 
                                   placeholder="Task title..." 
                                   required 
                                   minlength="5" 
                                   maxlength="100">
                        </div>
                        <div class="col-md-5">
                            <input type="text" 
                                   name="description" 
                                   class="form-control" 
                                   placeholder="Task description..." 
                                   required 
                                   minlength="5" 
                                   maxlength="500">
                        </div>
                        <div class="col-md-2">
                            <select name="status" class="form-select">
                                <option value="TO_DO">To Do</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="DONE">Done</option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-plus htmx-indicator spinner-border spinner-border-sm" role="status"></i>
                                Add
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Task List -->
        <div id="task-list" th:replace="~{tasks/fragments/task-list :: task-list}"></div>
        
        <!-- Loading indicator -->
        <div class="text-center htmx-indicator">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
</body>
</html>
